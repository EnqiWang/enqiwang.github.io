<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Controller | Enqi Wang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #2f2f2f;
      --text: #f4f4f4;
      --muted: #d8d8d8;
      --accent: #f974a6;
      --line: rgba(255,255,255,0.12);
      --shadow: 0 18px 44px rgba(0,0,0,0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.04), transparent 30%),
        linear-gradient(180deg, #343434 0%, #2b2b2b 100%);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: #3a3a3a;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 26px rgba(0,0,0,0.18);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f0f0f0;
      font-weight: 900;
    }

    .brand small {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.72);
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 34px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.52);
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--accent);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 22px 72px;
    }

    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      padding: 30px;
      margin-bottom: 22px;
    }

    .hero {
      text-align: center;
      padding-top: 28px;
    }

    .title {
      font-size: clamp(2rem, 3.8vw, 3.4rem);
      line-height: 1.05;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(1.05rem, 2vw, 1.45rem);
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 18px;
    }

    .rule {
      width: min(100%, 980px);
      height: 1px;
      margin: 0 auto 24px;
      background: rgba(255,255,255,0.36);
      opacity: 0.75;
    }

    .intro {
      max-width: 920px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--muted);
      text-align: left;
    }

    .viewer-wrap {
      margin: 24px auto 0;
      width: 100%;
      max-width: 980px;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(255,255,255,0.08);
      background: #1f1f1f;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .viewer-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .gallery-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .gallery-grid {
	  display: grid;
	  grid-template-columns: repeat(2, 1fr);
	  gap: 20px;
	}

	.shot {
	  background: #242424;
	  border: 1px solid rgba(255,255,255,0.06);
	  border-radius: 12px;
	  padding: 12px;

	  height: 320px;

	  display: flex;
	  align-items: center;
	  justify-content: center;
	}

	.shot img {
	  max-width: 100%;
	  max-height: 100%;
	  object-fit: contain;
	}

    .footer-note {
      text-align: center;
      color: rgba(255,255,255,0.72);
      font-size: 0.92rem;
      padding: 20px 0 0;
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .shot img {
        height: 220px;
      }

      .panel {
        padding: 22px;
      }
    }

    @media (max-width: 640px) {
      .topbar-inner {
        padding: 14px 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 18px;
      }

      main {
        padding: 20px 14px 56px;
      }

      .title {
        font-size: 1.9rem;
      }

      .subtitle {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        Enqi Wang
        <small>Game Developer</small>
      </div>
      <nav aria-label="Primary">
        <a href="index.html">Portfolio</a>
        <a href="kapture.html">Kapture</a>
        <a href="controller.html" class="active">Controller</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="panel hero">
      <h1 class="title">Custom Snake Camera Controller</h1>
      <div class="subtitle">Hardware prop for Kapture the Snake of 88'</div>
      <div class="rule"></div>

      <p class="intro">
        Designed the enclosure in Fusion 360 and printed it with a Bambu Lab P1S using PLA.
      </p>

      <div class="viewer-wrap">
        <iframe src="https://a360.co/3S0kGeT" title="Fusion 360 viewer" allowfullscreen></iframe>
      </div>
    </section>

    <section class="panel">
      <div class="gallery-title">Controller Gallery</div>
      <div class="gallery-grid">
        <div class="shot">
          <img src="icons_images/controller1.png" alt="Controller 1">
        </div>
        <div class="shot">
          <img src="icons_images/controller2.png" alt="Controller 2">
        </div>
        <div class="shot">
          <img src="icons_images/controller3.jpg" alt="Controller 3">
        </div>
        <div class="shot">
          <img src="icons_images/controller4.png" alt="Controller 4">
        </div>
      </div>
    </section>
  </main>

  <div class="footer-note">Enqi Wang © 2026</div>
</body>
</html>
