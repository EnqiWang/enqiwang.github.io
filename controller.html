<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snakeboy Customized Controller | Enqi Wang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
    --pink: #f974a6;
    --light-pink: #ffb8d1;

    --bg: #2f2f2f;
    --panel: #333333;
    --panel-2: #383838;

    --text: #f3f3f3;
    --muted: #d1d1d1;

    --card: #3a3a3a;
    --line: rgba(255,255,255,0.18);

    --shadow: 0 16px 44px rgba(0,0,0,0.34);
  }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

   body {
    font-family: "Inter", sans-serif;
    color: var(--text);

    background:
      radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 35%),
      linear-gradient(180deg, #333333 0%, #2b2b2b 100%);

    min-height: 100vh;
  }

    a {
      color: inherit;
      text-decoration: none;
    }

   header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background: #3b3b3b;
    border-bottom: 1px solid rgba(255,255,255,0.08);

    box-shadow: 0 8px 26px rgba(0,0,0,0.18);
    backdrop-filter: blur(10px);
  }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;

    font-size: 0.9rem;
    font-weight: 900;

    letter-spacing: 0.14em;
    text-transform: uppercase;

    color: #f0f0f0;
  }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
    color: rgba(255,255,255,0.52);
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  nav a:hover,
  nav a.active {
    color: var(--pink);
  }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 38px 24px 70px;
    }

    .section {
      padding: 28px 0 18px;
    }

    .section-title {
    text-align: center;
    font-size: clamp(2rem, 3.8vw, 3.4rem);
    line-height: 1.05;
    font-weight: 900;
    color: white;
    margin-bottom: 10px;
  }

    .underline {
    width: min(420px, 70%);
    height: 1px;
    background: rgba(255,255,255,0.45);
    margin: 0 auto 28px;
  }

    .lead {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 26px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.05rem;
    }

   .viewer-wrap {
    margin: 28px auto 0;
    width: 100%;
    max-width: 980px;
    aspect-ratio: 16 / 9;

    background: #222;
    border: 1px solid rgba(255,255,255,0.08);

    box-shadow: var(--shadow);
    overflow: hidden;
  }

    .viewer-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .gallery-section {
      margin-top: 34px;
    }

    .gallery-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--pink);
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .shot {
    background: #222;
    border: 1px solid rgba(255,255,255,0.08);

    box-shadow: var(--shadow);

    padding: 12px;
    height: 320px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
  }
    .shot img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .footer-note {
      text-align: center;
      padding: 38px 20px 46px;
      color: var(--pink);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .shot {
        height: 280px;
      }
    }

    @media (max-width: 640px) {
      .header-inner {
        padding: 14px 18px;
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 18px;
      }

      main {
        padding: 28px 16px 60px;
      }

      .section-title {
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .lead {
        font-size: 1rem;
      }

      .gallery-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--pink);
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">Enqi Wang</div>
      <nav aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="contact.html">About / Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <h1 class="section-title">Custom Controller</h1>
      <div class="underline"></div>
      <p class="lead">
        A custom Snake camera controller made as a hardware prop for <em>Kapture the Snake of 88'</em>.
        The enclosure was designed in Fusion 360 and printed with a Bambu Lab P1S using PLA.
      </p>

      <div class="viewer-wrap">
        <iframe src="https://a360.co/3S0kGeT" title="Fusion 360 viewer" allowfullscreen></iframe>
      </div>
    </section>

    <section class="gallery-section">
      <h2 class="gallery-title">Controller Gallery</h2>

      <div class="gallery-grid">
        <div class="shot">
          <img src="icons_images/controller1.png" alt="Controller 1">
        </div>
        <div class="shot">
          <img src="icons_images/controller2.png" alt="Controller 2">
        </div>
        <div class="shot">
          <img src="icons_images/controller4.png" alt="Controller 3">
        </div>
        <div class="shot">
          <img src="icons_images/controller3.jpg" alt="Controller 4">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
