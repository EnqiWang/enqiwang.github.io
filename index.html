<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enqi Wang | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f974a6;
      --light-pink: #ffd1e2;
      --bg: #ffffff;
      --text: #2f2f2f;
      --muted: #6d6d6d;
      --card: #fff7fa;
      --line: #f3d7e3;
      --shadow: 0 18px 50px rgba(249, 116, 166, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--pink);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 38px 24px 70px;
    }

    .section {
      padding: 28px 0 18px;
    }

    .section-title {
      text-align: center;
      font-size: clamp(2.2rem, 4vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .underline {
      width: min(420px, 70%);
      height: 1px;
      background: var(--light-pink);
      margin: 0 auto 28px;
    }

    .lead {
      text-align: center;
      max-width: 860px;
      margin: 0 auto 26px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .project-grid {
      display: grid;
      gap: 16px;
    }

    .project-grid.featured {
	  grid-template-columns: repeat(2, 1fr);
	  max-width: 1200px;
	  margin: 0 auto;
	  gap: 20px;
	}

    .project-grid.college {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 820px;
      margin: 0 auto;
    }

    .project-card {
      position: relative;
      display: block;
      overflow: hidden;
      border-radius: 0;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 60px rgba(249, 116, 166, 0.15);
    }

    .project-image {
	  width: 100%;
	  height: 280px;
	  display: block;
	  object-fit: cover;
	}

    .project-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: end;
      justify-content: flex-start;
      padding: 18px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.00) 0%,
        rgba(0, 0, 0, 0.56) 100%
      );
      color: #fff;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .project-card:hover .project-overlay {
      opacity: 1;
    }

    .project-title {
      font-size: 1.55rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      text-transform: uppercase;
    }

    .project-subtitle {
      display: block;
      margin-top: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 820px;
      margin: 0 auto;
    }

    .tile {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow);
      min-height: 170px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 60px rgba(249, 116, 166, 0.15);
    }

    .tile img {
      width: 100%;
      height: 170px;
      display: block;
      object-fit: cover;
    }

    .tile-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(1px);
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .tile:hover .tile-overlay {
      opacity: 1;
    }

    .tile-title {
      color: white;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
      padding: 0 14px;
    }

    .simple-footer {
      text-align: center;
      padding: 38px 20px 46px;
      color: var(--pink);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    @media (max-width: 900px) {
      .project-grid.college,
      .tile-grid {
        grid-template-columns: 1fr;
      }

      .project-image {
        height: 200px;
      }

      .tile img {
        height: 180px;
      }
    }

    @media (max-width: 640px) {
      .header-inner {
        padding: 14px 18px;
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 18px;
      }

      main {
        padding: 28px 16px 60px;
      }

      .section-title {
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .lead {
        font-size: 1rem;
      }

      .project-title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">Enqi Wang</div>
      <nav aria-label="Primary">
        <a href="#home" class="active">Home</a>
        <a href="contact.html">About / Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="section">
      <h1 class="section-title">Portfolio</h1>
      <div class="underline"></div>
      <p class="lead">
      </p>

      <div class="project-grid featured">
        <a class="project-card" href="kapture.html">
          <img class="project-image" src="icons_images/Kapture the snake of 88'.png" alt="Kapture the Snake of 88 banner">
          <div class="project-overlay">
            <div>
              <div class="project-title">Kapture the Snake of 88'</div>
              <span class="project-subtitle">Game Project</span>
            </div>
          </div>
        </a>

        <a class="project-card" href="territoria.html">
          <img class="project-image" src="icons_images/game.jpg" alt="Territoria banner">
          <div class="project-overlay">
            <div>
              <div class="project-title">Territoria</div>
              <span class="project-subtitle">Game Project</span>
            </div>
          </div>
        </a>
      </div>
    </section>

    <section class="section" id="college-projects">
      <h2 class="section-title">College Projects</h2>
      <div class="underline"></div>
      <p class="lead">
        Hardware and engineering projects I’m building out next.
      </p>

      <div class="tile-grid">
        <a class="tile" href="controller.html">
          <img src="icons_images/controller-placeholder.jpg" alt="Customized Controller">
          <div class="tile-overlay">
            <div class="tile-title">Customized Controller</div>
          </div>
        </a>

        <a class="tile" href="owc.html">
          <img src="icons_images/owc-placeholder.jpg" alt="OWC Prototype">
          <div class="tile-overlay">
            <div class="tile-title">OWC Prototype</div>
          </div>
        </a>

        <a class="tile" href="project-3.html">
          <img src="icons_images/project-placeholder.jpg" alt="Project Placeholder">
          <div class="tile-overlay">
            <div class="tile-title">Project Three</div>
          </div>
        </a>

        <a class="tile" href="project-4.html">
          <img src="icons_images/project-placeholder.jpg" alt="Project Placeholder">
          <div class="tile-overlay">
            <div class="tile-title">Project Four</div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer class="simple-footer">
    Enqi Wang © 2026
  </footer>
</body>
</html>
